[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "isfallacy"
version = "0.1.0"
description = "Reproducible dataset preparation and FATE evaluation for ISFallacy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "tenacity>=8.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
isfallacy = "isfallacy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isfallacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

